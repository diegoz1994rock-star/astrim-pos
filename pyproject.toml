[project]
name = "pos-system"
version = "0.1.0"
description = "Sistema POS profesional, modular y configurable para cualquier tipo de negocio."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "PySide6>=6.7",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.7",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "websockets>=12.0",
    "httpx>=0.27",
    "reportlab>=4.2",
    "openpyxl>=3.1",
    "APScheduler>=3.10",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
dev = [
    "pytest>=8.2",
    "pytest-qt>=4.4",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "factory_boy>=3.3",
    "types-openpyxl",
    "types-reportlab",
]

[project.scripts]
pos = "pos.main:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/pos"]
omit = ["*/presentation/*"]
